<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minivilles - Lobby</title>
    <link rel="stylesheet" href="lobby_style.css">
</head>
<body>
    <button class="btn-settings" id="settingsBtn"></button>

    <div class="lobby-content">
        <div class="header-group">
            <h1 class="room-code">A4HUI5</h1>
            <p class="timer">00:00</p>
        </div>

        <div class="info-section">
            <img src="assets/basis/dice_icon_basis.png" alt="dé" class="dice-icon">
            <span class="info-text">Durée du tour : 1 min</span>
        </div>

        <div class="players-row">
            <div class="player-slot">
                <div class="player-container">
                    <img src="assets/basis/player_button_basis.png" alt="Socle" class="player-base">
                </div>
            </div>
            <div class="player-slot">
                <div class="player-container">
                    <img src="assets/basis/player_button_basis.png" alt="Socle" class="player-base">
                </div>
            </div>
            <div class="player-slot">
                <div class="player-container">
                    <img src="assets/basis/player_button_basis.png" alt="Socle" class="player-base">
                </div>
            </div>
            <div class="player-slot">
                <div class="player-container">
                    <img src="assets/basis/player_button_basis.png" alt="Socle" class="player-base">
                </div>
            </div>
        </div>

        <div class="footer-section">
            <button class="btn-ready" id="readyBtn"></button>
        </div>
    </div>
</body>
</html>
